[package]
name = "ghcli-setup"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "ghcli-setup"
path = "src/main.rs"

[[bin]]
name = "ghcli-reset"
path = "src/reset_main.rs"

[[bin]]
name = "ghcli-mangen"
path = "src/mangen.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.11"
console = "0.15"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tempfile = "3"
dirs = "6"
anyhow = "1"
regex = "1"
ureq = { version = "2", features = ["json"] }
clap_mangen = "0.2"
